name: Android native Indra's Pearls

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compilers:
    uses: ./.github/workflows/ick-compilers.yml

  host-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/ick-host@4ea071a96239f3a29ca6d98454feb59947d87cfe
        id: ick
      - name: Build and run the unchanged mathematics suites through ICK
        run: make -f tests/Makefile test ICK="${{ steps.ick.outputs.compiler }}" ICK_LINK_FLAGS="${{ steps.ick.outputs.link_flags }}"
      - name: Check out the declared toolchain contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
          persist-credentials: false
      - name: Enforce the ICK and NDK stage declarations
        run: |
          "${{ steps.ick.outputs.compiler }}" ${{ steps.ick.outputs.link_flags }} -std=c17 -O2 -Wall -Wextra -Werror .ai-ci-ick/src/aici.c -o "$RUNNER_TEMP/aici-icky"
          "$RUNNER_TEMP/aici-icky" verify .ai-ci-ick/contracts/build-toolchain-v0.contract.tsv .

  android:
    needs: compilers
    runs-on: ubuntu-latest
    env:
      INDRAS_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      INDRAS_TEST_KEYSTORE_PASSWORD: wegert-debug
      INDRAS_TEST_KEY_ALIAS: wegert-debug
      INDRAS_TEST_KEY_PASSWORD: wegert-debug
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"

      - name: Check out the qualified C stage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
          persist-credentials: false

      - name: Download the three qualified ABI stages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ick-*
          path: build/ick-packages
          merge-multiple: true

      - name: Restore the installed compiler stages
        run: |
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=arm64-v8a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/arm64-v8a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-arm64-v8a.tar.gz"
          make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=x86_64 ICK_STAGE="$GITHUB_WORKSPACE/build/ick/x86_64" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-x86_64.tar.gz"

      - name: Build debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Verify standard APK signer
        uses: isomorphisms/ai-ci/android-signing@fbac8ed36c1aa9c14024c92b724fb334ffbbcef3
        with:
          apk: android/app/build/outputs/apk/debug/app-debug.apk
          lane: test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indras-pearls-restored-candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk


  qemu-original-raster:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact restored APK from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: indras-pearls-restored-candidate
          path: qemu-apk

      - name: Install image comparison utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Prove original Kleinian raster reaches GPU and display
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/qemu-original-raster.sh qemu-apk/app-debug.apk qemu-original

      - name: Retain restored-raster evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indras-pearls-qemu-original-${{ github.run_id }}
          path: qemu-original/
          if-no-files-found: error


  qemu-original-trace-controls:
    needs:
      - android
      - qemu-original-raster
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact restored APK from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: indras-pearls-restored-candidate
          path: qemu-apk

      - name: Install image comparison utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Prove original trace controls change the control-free raster
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/qemu-original-trace-controls.sh qemu-apk/app-debug.apk qemu-original-traces

      - name: Publish emulator-accepted interactive APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indras-pearls-emulator-accepted
          path: |
            qemu-apk/app-debug.apk
            qemu-original-traces/status.tsv
            qemu-original-traces/results.tsv
          if-no-files-found: error

      - name: Retain trace-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indras-pearls-qemu-traces-${{ github.run_id }}
          path: qemu-original-traces/
          if-no-files-found: error


  ick-armv7-boundary:
    needs: compilers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ICK_COMMIT: c61e448251744a2f40ad743ebef1a027bdcd2f9d
      ANDROID_NDK_VERSION: 29.0.14206865
      INDRAS_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      INDRAS_TEST_KEYSTORE_PASSWORD: wegert-debug
      INDRAS_TEST_KEY_ALIAS: wegert-debug
      INDRAS_TEST_KEY_PASSWORD: wegert-debug
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out stable public test signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Check out the qualified C stage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ai-ci
          ref: 4ea071a96239f3a29ca6d98454feb59947d87cfe
          path: .ai-ci-ick
          persist-credentials: false

      - name: Download the qualified ARM compiler stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ick-armeabi-v7a
          path: build/ick-packages

      - name: Restore the installed ARM stage
        run: make -f .ai-ci-ick/ick-android/Makefile restore-stage ABI=armeabi-v7a ICK_STAGE="$GITHUB_WORKSPACE/build/ick/armeabi-v7a" ICK_ARCHIVE="$GITHUB_WORKSPACE/build/ick-packages/ick-armeabi-v7a.tar.gz"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"

      - name: Compile original Kleinian production core with ICK
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          make -f tests/Makefile arm-boundary \
            ICK_ARMV7="$GITHUB_WORKSPACE/build/ick/armeabi-v7a/bin/arm-linux-gnueabi-gcc" \
            NDK="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"

          readelf -A build/ick/armeabi-v7a/original_kleinian.o \
            | tee build/ick/armeabi-v7a/original_kleinian.attributes
          grep -q 'Tag_CPU_arch: v7' build/ick/armeabi-v7a/original_kleinian.attributes
          grep -q 'Tag_THUMB_ISA_use: Thumb-2' build/ick/armeabi-v7a/original_kleinian.attributes
          if grep -q 'Tag_ABI_VFP_args: VFP registers' \
            build/ick/armeabi-v7a/original_kleinian.attributes; then
            echo 'hard-float ABI is not Android armeabi-v7a' >&2
            exit 1
          fi

      - name: Retain strict standalone ICK to NDK link probe
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm_bin/llvm-readelf" -h build/ick/armeabi-v7a/libindras-original-kleinian.so \
            | tee build/ick/armeabi-v7a/ick-original.elf
          grep -q 'Class:.*ELF32' build/ick/armeabi-v7a/ick-original.elf
          grep -q 'Machine:.*ARM' build/ick/armeabi-v7a/ick-original.elf
          "$llvm_bin/llvm-nm" -D --defined-only \
            build/ick/armeabi-v7a/libindras-original-kleinian.so \
            | grep -q 'indras_original_kleinian_ndk_probe'

      - name: Build actual ARMv7 APK with ICK production core
        run: |
          set -euxo pipefail
          gradle --no-daemon :android:app:assembleDebug \
            -PickArmv7=true \
            -PickOriginalKleinianObject="$GITHUB_WORKSPACE/build/ick/armeabi-v7a/original_kleinian.o"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            build/indras-pearls-ick-armeabi-v7a-debug.apk

      - name: Inspect packaged ICK APK
        run: |
          set -euxo pipefail
          apk=build/indras-pearls-ick-armeabi-v7a-debug.apk
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"

          unzip -Z1 "$apk" | tee build/ick-apk-files.txt
          test "$(grep -c '^lib/armeabi-v7a/libindras_pearls.so$' build/ick-apk-files.txt)" -eq 1
          ! grep -E '^lib/(arm64-v8a|x86|x86_64)/' build/ick-apk-files.txt
          ! grep -E '(^|/)classes[0-9]*\.dex$' build/ick-apk-files.txt

          unzip -p "$apk" lib/armeabi-v7a/libindras_pearls.so \
            > build/ick/armeabi-v7a/libindras_pearls-packaged.so
          "$llvm_bin/llvm-readelf" -h build/ick/armeabi-v7a/libindras_pearls-packaged.so \
            | tee build/ick/armeabi-v7a/packaged.elf
          grep -q 'Class:.*ELF32' build/ick/armeabi-v7a/packaged.elf
          grep -q 'Machine:.*ARM' build/ick/armeabi-v7a/packaged.elf

          "$llvm_bin/llvm-nm" -D --defined-only \
            build/ick/armeabi-v7a/libindras_pearls-packaged.so \
            | tee build/ick/armeabi-v7a/packaged.exports
          grep -q 'original_kleinian_generate_points_from_traces' \
            build/ick/armeabi-v7a/packaged.exports

          printf '%s\n' "$ICK_COMMIT" > build/ick-source-commit.txt
          git rev-parse HEAD > build/indras-pearls-source-commit.txt

      - name: Verify ICK APK signer
        uses: isomorphisms/ai-ci/android-signing@fbac8ed36c1aa9c14024c92b724fb334ffbbcef3
        with:
          apk: build/indras-pearls-ick-armeabi-v7a-debug.apk
          lane: test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indras-pearls-ick-armv7-${{ github.sha }}
          path: |
            build/indras-pearls-ick-armeabi-v7a-debug.apk
            build/ick/armeabi-v7a/original_kleinian.o
            build/ick/armeabi-v7a/original_kleinian.attributes
            build/ick/armeabi-v7a/ick-original.elf
            build/ick/armeabi-v7a/packaged.elf
            build/ick/armeabi-v7a/packaged.exports
            build/ick-apk-files.txt
            build/ick-source-commit.txt
            build/indras-pearls-source-commit.txt
          if-no-files-found: error
