name: Android native Indra's Pearls stub

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-mathematics:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK test toolchain
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Build and run deterministic mathematics tests with NDK Clang
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk_cc="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          host=(--target=x86_64-linux-gnu --gcc-toolchain=/usr)

          "$ndk_cc" "${host[@]}" -std=c17 -Wall -Wextra -Werror -pedantic -O2             -I android/app/src/main/cpp             android/app/src/main/cpp/mobius_math.c             android/app/src/main/cpp/renderer_packet.c             tests/mobius_math_test.c -lm             -o /tmp/indras-pearls-mobius-math-test
          /tmp/indras-pearls-mobius-math-test

          "$ndk_cc" "${host[@]}" -std=c17 -Wall -Wextra -Werror -pedantic -O2             -I android/app/src/main/cpp             android/app/src/main/cpp/original_kleinian.c             tests/original_kleinian_test.c -lm             -o /tmp/indras-pearls-original-kleinian-test
          /tmp/indras-pearls-original-kleinian-test

  android:
    runs-on: ubuntu-latest
    env:
      INDRAS_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      INDRAS_TEST_KEYSTORE_PASSWORD: wegert-debug
      INDRAS_TEST_KEY_ALIAS: wegert-debug
      INDRAS_TEST_KEY_PASSWORD: wegert-debug
    steps:
      - uses: actions/checkout@v4

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Verify standard APK signer
        uses: isomorphisms/ai-ci/android-signing@fbac8ed36c1aa9c14024c92b724fb334ffbbcef3
        with:
          apk: android/app/build/outputs/apk/debug/app-debug.apk
          lane: test

      - uses: actions/upload-artifact@v4
        with:
          name: indras-pearls-restored-candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk


  qemu-original-raster:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact restored APK from this workflow
        uses: actions/download-artifact@v4
        with:
          name: indras-pearls-restored-candidate
          path: qemu-apk

      - name: Install image comparison utility
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Prove original Kleinian raster reaches GPU and display
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/qemu-original-raster.sh qemu-apk/app-debug.apk qemu-original

      - name: Retain restored-raster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indras-pearls-qemu-original-${{ github.run_id }}
          path: qemu-original/
          if-no-files-found: error


  ick-armv7-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ICK_COMMIT: ea034a574097e81d1027660b39c3e1c185d11b80
      ANDROID_NDK_VERSION: 29.0.14206865
      INDRAS_TEST_KEYSTORE: ${{ github.workspace }}/.test-signing/_/build/app/wegert-debug.keystore
      INDRAS_TEST_KEYSTORE_PASSWORD: wegert-debug
      INDRAS_TEST_KEY_ALIAS: wegert-debug
      INDRAS_TEST_KEY_PASSWORD: wegert-debug
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out stable public test signer
        uses: actions/checkout@v4
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false

      - name: Check out pinned ICK C compiler source
        uses: actions/checkout@v4
        with:
          repository: dilapidated-shed/ick
          ref: ${{ env.ICK_COMMIT }}
          path: _ick
          submodules: true

      - name: Build ARMv7 ICK C compiler
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev \
            binutils-arm-linux-gnueabi
          (
            cd _ick
            . ick/SOURCE.lock
            test "$(git -C gcc rev-parse HEAD)" = "$gcc_commit"
            sh ick/materialize.sh gcc source
            mkdir build stage
            cd build
            ../source/configure \
              --target=arm-linux-gnueabi \
              --prefix="$GITHUB_WORKSPACE/_ick/stage" \
              --with-as="$(command -v arm-linux-gnueabi-as)" \
              --with-ld="$(command -v arm-linux-gnueabi-ld)" \
              --enable-languages=c \
              --disable-bootstrap \
              --disable-multilib \
              --disable-nls \
              --disable-shared \
              --disable-threads \
              --without-headers \
              --disable-libatomic \
              --disable-libgomp \
              --disable-libquadmath \
              --disable-libssp \
              --disable-libvtv
            make -j2 all-gcc
            make install-gcc
          )

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build toolchain
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile original Kleinian production core with ICK
        run: |
          set -euxo pipefail
          mkdir -p build/ick/armeabi-v7a
          ick="$GITHUB_WORKSPACE/_ick/stage/bin/arm-linux-gnueabi-gcc"
          flags=(-march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp)
          include=(-I android/app/src/main/cpp)

          "$ick" "${flags[@]}" -std=c11 -O2 -fPIC -ffreestanding \
            -DINDRAS_FREESTANDING_MATH "${include[@]}" \
            -c android/app/src/main/cpp/original_kleinian.c \
            -o build/ick/armeabi-v7a/original_kleinian.o

          arm-linux-gnueabi-readelf -A build/ick/armeabi-v7a/original_kleinian.o \
            | tee build/ick/armeabi-v7a/original_kleinian.attributes
          grep -q 'Tag_CPU_arch: v7' build/ick/armeabi-v7a/original_kleinian.attributes
          grep -q 'Tag_THUMB_ISA_use: Thumb-2' build/ick/armeabi-v7a/original_kleinian.attributes
          if grep -q 'Tag_ABI_VFP_args: VFP registers' \
            build/ick/armeabi-v7a/original_kleinian.attributes; then
            echo 'hard-float ABI is not Android armeabi-v7a' >&2
            exit 1
          fi

      - name: Retain strict standalone ICK to NDK link probe
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ndk_cc="$llvm_bin/armv7a-linux-androideabi21-clang"
          include=(-I android/app/src/main/cpp)

          "$ndk_cc" -std=c11 -O2 -fPIC "${include[@]}" \
            -c tests/original_kleinian_ndk_probe.c \
            -o build/ick/armeabi-v7a/original_kleinian_ndk_probe.o
          "$ndk_cc" -shared -Wl,-z,defs -Wl,-z,text -Wl,--fatal-warnings \
            build/ick/armeabi-v7a/original_kleinian.o \
            build/ick/armeabi-v7a/original_kleinian_ndk_probe.o \
            -lm -o build/ick/armeabi-v7a/libindras-original-kleinian.so

          "$llvm_bin/llvm-readelf" -h build/ick/armeabi-v7a/libindras-original-kleinian.so \
            | tee build/ick/armeabi-v7a/ick-original.elf
          grep -q 'Class:.*ELF32' build/ick/armeabi-v7a/ick-original.elf
          grep -q 'Machine:.*ARM' build/ick/armeabi-v7a/ick-original.elf
          "$llvm_bin/llvm-nm" -D --defined-only \
            build/ick/armeabi-v7a/libindras-original-kleinian.so \
            | grep -q 'indras_original_kleinian_ndk_probe'

      - name: Build actual ARMv7 APK with ICK production core
        run: |
          set -euxo pipefail
          gradle --no-daemon :android:app:assembleDebug \
            -PickArmv7=true \
            -PickOriginalKleinianObject="$GITHUB_WORKSPACE/build/ick/armeabi-v7a/original_kleinian.o"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            build/indras-pearls-ick-armeabi-v7a-debug.apk

      - name: Inspect packaged ICK APK
        run: |
          set -euxo pipefail
          apk=build/indras-pearls-ick-armeabi-v7a-debug.apk
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"

          unzip -Z1 "$apk" | tee build/ick-apk-files.txt
          test "$(grep -c '^lib/armeabi-v7a/libindras_pearls.so$' build/ick-apk-files.txt)" -eq 1
          ! grep -E '^lib/(arm64-v8a|x86|x86_64)/' build/ick-apk-files.txt
          ! grep -E '(^|/)classes[0-9]*\.dex$' build/ick-apk-files.txt

          unzip -p "$apk" lib/armeabi-v7a/libindras_pearls.so \
            > build/ick/armeabi-v7a/libindras_pearls-packaged.so
          "$llvm_bin/llvm-readelf" -h build/ick/armeabi-v7a/libindras_pearls-packaged.so \
            | tee build/ick/armeabi-v7a/packaged.elf
          grep -q 'Class:.*ELF32' build/ick/armeabi-v7a/packaged.elf
          grep -q 'Machine:.*ARM' build/ick/armeabi-v7a/packaged.elf

          "$llvm_bin/llvm-nm" -D --defined-only \
            build/ick/armeabi-v7a/libindras_pearls-packaged.so \
            | tee build/ick/armeabi-v7a/packaged.exports
          grep -q 'original_kleinian_generate_points_from_traces' \
            build/ick/armeabi-v7a/packaged.exports

          printf '%s\n' "$ICK_COMMIT" > build/ick-source-commit.txt
          git rev-parse HEAD > build/indras-pearls-source-commit.txt

      - name: Verify ICK APK signer
        uses: isomorphisms/ai-ci/android-signing@fbac8ed36c1aa9c14024c92b724fb334ffbbcef3
        with:
          apk: build/indras-pearls-ick-armeabi-v7a-debug.apk
          lane: test

      - uses: actions/upload-artifact@v4
        with:
          name: indras-pearls-ick-armv7-${{ github.sha }}
          path: |
            build/indras-pearls-ick-armeabi-v7a-debug.apk
            build/ick/armeabi-v7a/original_kleinian.o
            build/ick/armeabi-v7a/original_kleinian.attributes
            build/ick/armeabi-v7a/ick-original.elf
            build/ick/armeabi-v7a/packaged.elf
            build/ick/armeabi-v7a/packaged.exports
            build/ick-apk-files.txt
            build/ick-source-commit.txt
            build/indras-pearls-source-commit.txt
          if-no-files-found: error
